<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<style>

body{

background:#4facfe;

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.box{

background:white;

padding:30px;

border-radius:15px;

width:350px;

box-shadow:0 5px 20px rgba(0,0,0,.2);

}

input{

width:100%;

padding:12px;

margin-top:15px;

border-radius:8px;

border:1px solid #ccc;

box-sizing:border-box;

}

button{

width:100%;

padding:12px;

margin-top:20px;

background:#007BFF;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

font-size:16px;

}

button:hover{

background:#0056b3;

}

a{

display:block;

margin-top:15px;

text-align:center;

text-decoration:none;

}

</style>

</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<form action="/reset_password" method="POST">

<input
type="email"
name="email"
placeholder="Registered Email"
required>

<input
type="password"
name="password"
placeholder="New Password"
required>

<button type="submit">

Reset Password

</button>

</form>

<a href="/login">

Back to Login

</a>

</div>

</body>

</html>
